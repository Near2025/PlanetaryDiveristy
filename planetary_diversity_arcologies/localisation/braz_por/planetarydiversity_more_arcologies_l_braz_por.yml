 district_pd_arcology_research_desc: "Laboratórios com torres altas, repletos de mentes brilhantes, onde a concorrência é tão intensa quanto a pesquisa."
 district_pd_arcology_industrial: "Arcologia Industrial"
 district_pd_arcology_industrial_plural: "Arcologias Industriais"
 district_pd_arcology_industrial_desc: Repleto de instalações de fundição e fábricas, Esses distritos transformam matérias-primas em produtos avançados em suas estruturas imponentes."
 district_arcology_pd_trade: "Arcologia Comercial"
