#Buildings
 building_pd_rogue_council: "Conselho de Biotroféu"
 building_pd_rogue_council_desc: "A colocação de BioTrofeis selecionados em funções de liderança satisfaz suas necessidades intrínsecas de hierarquia social, com um “impasse político” intencionalmente projetado, criando uma ilusão de conflito. Essa estratégia libera os drones para se concentrarem em melhorar o cuidado e a satisfação dos Biotrofeis."
 building_navel_base: "Escritório Naval "
 building_navel_base_desc: "Um bastião interestelar, essa base militar planetária  é  um centro de suporte essencial para nossas frotas."
 building_navel_command: "Centro de Comando Naval"
 building_navel_command_desc: "Uma fortaleza de comando colossal , esse complexo militar serve com um centro nervoso para a administração estrategica  de nossa armada  interestelar ."

