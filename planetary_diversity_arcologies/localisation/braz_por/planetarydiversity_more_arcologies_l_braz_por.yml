 pd_garden_arcology_desc: "Essa ecumenopolis Ostenta vastas extensões de jardins meticulosamente selecionados e controlados, creando vastos cinturões verdes em meio a expansão urbana."
 pd_fortress_arcology: "Arcologia Fortaleza"
 pd_fortress_arcology_desc: "Essa ecumenopolis serve como um centro de comando militar em escala planetária, repleta de aposentos, Instalações de treinamento, e Fabricas de armas."
 pd_commercial_arcology: "Arcologia Comercial "
 pd_commercial_arcology_desc: "Essa ecumenopolis é um nexus de comercio Intergaláctico , repleto de mercados movimentados, vastos centros comerciais, e extensivas Infraestruturas Logísticas."
