#Senate
 decision_pd_arcology_senate: "Construir Cúpula do Senado"
 decision_pd_arcology_senate_desc: "Para satisfazer as necessidades de nossa nação em expansão, nos devemos construir uma construção monumental para o senado em nossa capital, dedicando espaço considerável para melhorar nossas capacidades administrativas governamentais."
 decision_pd_arcology_senate_effects: "Adds the §Y$d_pd_senate_building$§! to this capital, exhanging potential distrticts to enhance our government's administration capabilities."
 d_pd_senate_building: "Cúpula do Senado"
 d_pd_senate_building_desc: "A cúpula do senado, um símbolo majestoso de nossa governança, permanece como o  coração administrativo  onde o futuro de nossa civilização  é forjado."

#Palace
 decision_pd_arcology_palace: "Construir Complexo Palaciano"
 decision_pd_arcology_palace_desc: "Para refletir  o poder e a autoridade de nosso império, nós devemos erguer um palácio colossal em nossa capital. Esse grande edificio irá emcorporar o poder de nossa liderança e aumentar significativamente  nossa administração governamental."
 decision_pd_arcology_palace_effects: "Adds the §Y$d_pd_palace_building$§! to this capital, exhanging potential distrticts to enhance our government's administration capabilities."
 d_pd_palace_building: "Complexo Palaciano"
 d_pd_palace_building_desc: "O complexo palaciano, o maior símbolo de nossa Soberania e o poder do governante, domina a capital. É o coração de nosso governo, onde o destino de nosso império é  moldado."

#Headquarters
 decision_pd_arcology_headquarters: "Construir Sede Planetária"
 decision_pd_arcology_headquarters_desc: "Para Mostrar o  poder e influencia de nossa megacorporação, nós iremos construir uma sede imponente  neste centro económico. Essa estrutura imponente irá representar nossa força de liderança e melhorara Imensamente nossas operações galáticas."
 decision_pd_arcology_headquarters_effects: "Adds the §Y$d_pd_headquarters_building$§! to this capital, exhanging potential distrticts to enhance our corporation's administration capabilities."
 d_pd_headquarters_building: "Sede Planetária"
 d_pd_headquarters_building_desc: "Um símbolo monumental de dominancia, Essas sedes se erguem sobre o planeta.  serve como o centro nervoso para nossa operações, onde o futuro de nossa megacorporação é gerado."

#Hive Confluence Spire
 decision_pd_hive_confluence_spire: "Construir Torre de Convergência"
 decision_pd_hive_confluence_spire_desc: "Para manifestar a supremacia e o alcançe de nosso coletivo, nós devemos desenvolver uma poderosa torre de convergência. Essa Estrutura de comando irá amplificar substancialmente nossa operações através das estrelas."
 decision_pd_hive_confluence_spire_effects: "Adds the §Y$d_pd_confluence_spire_building$§! to this capital, exhanging potential distrticts to enhance our administration capabilities."
 d_pd_confluence_spire_building: "Torre de Convergência"
 d_pd_confluence_spire_building_desc: "essa torre  permanece suprema em toda a superficie planetária, um imponente farol de controle. É o centro de nossa vontade coletiva, onde nosso caminho entre as estrelas é intricadamente tecido."

#Machine Centralized Processing
 decision_pd_machine_centralized_processing: "Construir Unidade de Processamento Centralizada"
 decision_pd_machine_centralized_processing_desc: "Para afirmar nossa superioridade e extender nossa capacidade operacional, nós iremos construir uma Unidade de Processamento Centralizada. essa estrutura irá  melhorar consideravelmente nossas funções galáticas."
 decision_pd_machine_centralized_processing_effects: "Adds the §Y$d_pd_machine_centralized_processing$§! to this capital, exhanging potential distrticts to enhance our administration capabilities."
 d_pd_machine_centralized_processing: "Unidade de Processamento Centralizada"
 d_pd_machine_centralized_processing_desc: "Essa unidade de processamento  domina a superficie planetária e é o nodulo central de nossa diretivas coletivas, harmonizando intrincadamente nossos drones."
