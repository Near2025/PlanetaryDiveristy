l_braz_por:

#Senate
 decision_pd_arcology_senate: "Construir a cúpula do Senado"
 decision_pd_arcology_senate_desc: "Para atender às necessidades de expansão de nossa nação, precisamos construir um edifício monumental para o Senado em nossa capital, dedicando um espaço substancial para aprimorar os recursos administrativos de nosso governo."
 decision_pd_arcology_senate_effects: "Adds the §Y$d_pd_senate_building$§! to this capital, exhanging potential distrticts to enhance our government's administration capabilities."
 d_pd_senate_building: "Cúpula do Senado"
 d_pd_senate_building_desc: "A  cúpula do senado, um simbulo majestoso de governança, se destaca como o coração administrativo onde o futuro de nossa civilização é forjado."

#Palace
 decision_pd_arcology_palace: "Construir um complexo palaciano"
 decision_pd_arcology_palace_desc: "Para refletir o poder e a autoridade de nosso império, ergueremos um palácio colossal em nossa capital. Esse grande edifício incorporará o poder de nossa liderança e aumentará significativamente nossa administração governamental."
 decision_pd_arcology_palace_effects: "Adds the §Y$d_pd_palace_building$§! to this capital, exhanging potential distrticts to enhance our government's administration capabilities."
 d_pd_palace_building: "Complexo Palaciano"
 d_pd_palace_building_desc: "O Complexo do Palácio, um grande símbolo de nossa soberania e do poder do governante, domina a capital. É o coração da governança, onde o destino do nosso império é moldado."

#Headquarters
 decision_pd_arcology_headquarters: "Construir a sede planetária"
 decision_pd_arcology_headquarters_desc: "Para mostrar o poder e a influência da nossa megacorporação, construiremos uma sede imponente nesse centro econômico. Essa estrutura imponente representará a força de nossa liderança e melhorará muito nossas operações galáticas."
 decision_pd_arcology_headquarters_effects: "Adds the §Y$d_pd_headquarters_building$§! to this capital, exhanging potential distrticts to enhance our corporation's administration capabilities."
 d_pd_headquarters_building: "Sede planetária"
 d_pd_headquarters_building_desc: "Um símbolo monumental de domínio, esta sede se ergue sobre o planeta. Ela serve como o centro nervoso de nossas operações, onde o futuro de nossa megacorporação é elaborado."

#Hive Confluence Spire
 decision_pd_hive_confluence_spire: "Criar a Torre de Confluência"
 decision_pd_hive_confluence_spire_desc: "Para manifestar a supremacia e o alcance de nossa coletividade, faremos crescer uma poderosa torre de confluência. Essa estrutura de comando ampliará significativamente nossas operações nas estrelas."
 decision_pd_hive_confluence_spire_effects: "Adds the §Y$d_pd_confluence_spire_building$§! to this capital, exhanging potential distrticts to enhance our administration capabilities."
 d_pd_confluence_spire_building: "Torre de Confluência"
 d_pd_confluence_spire_building_desc: "Essa torre é suprema em toda a superfície do planeta, um farol imponente de controle. É o centro de nossa vontade coletiva, onde nosso caminho entre as estrelas é intrinsecamente tecido."

#Machine Centralized Processing
 decision_pd_machine_centralized_processing: "Cosntruir Unidade Centralizada de Processamento"
 decision_pd_machine_centralized_processing_desc: "Para afirmar nossa superioridade e ampliar a capacidade operacional, construiremos uma Unidade de Processamento Centralizado. Essa estrutura aumentará significativamente nossas funções galácticas."
 decision_pd_machine_centralized_processing_effects: "Adds the §Y$d_pd_machine_centralized_processing$§! to this capital, exhanging potential distrticts to enhance our administration capabilities."
 d_pd_machine_centralized_processing: "Unidade Centralizada de Processamento"
 d_pd_machine_centralized_processing_desc: "Essa unidade de processamento domina a superfície planetária e é o nó central de nossas diretrizes coletivas, orquestrando intrincadamente nossos drones."
